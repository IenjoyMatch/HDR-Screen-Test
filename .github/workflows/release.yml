name: Release v0.1.1
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-and-release:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Release v0.1.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze and test
        run: |
          flutter analyze lib test
          flutter test test/navigation_test.dart
      - name: Build ARM APKs
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64
      - name: Verify APK sizes and signatures
        run: |
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            bytes=$(stat -c%s "$apk")
            echo "$apk: $bytes bytes"
            test "$bytes" -lt 30000000
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -E '^(package:|sdkVersion:|targetSdkVersion:|native-code:)'
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk HDR-Screen-Test-v0.1.1-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk HDR-Screen-Test-v0.1.1-armeabi-v7a.apk
          gh release create v0.1.1 HDR-Screen-Test-v0.1.1-arm64-v8a.apk HDR-Screen-Test-v0.1.1-armeabi-v7a.apk --title 'HDR Screen Test v0.1.1' --notes-file RELEASE_NOTES_v0.1.1.md

