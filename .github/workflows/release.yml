name: Release v1.0.0
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-and-release:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Release v1.0.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze and test
        run: |
          flutter analyze lib test
          flutter test test/navigation_test.dart
      - name: Build ARM APKs
        env:
          HDR_KEYSTORE_BASE64: ${{ secrets.HDR_KEYSTORE_BASE64 }}
          HDR_KEYSTORE_PASSWORD: ${{ secrets.HDR_KEYSTORE_PASSWORD }}
          HDR_KEYSTORE_PATH: ${{ runner.temp }}/hdr-release.jks
        run: |
          test -n "$HDR_KEYSTORE_BASE64" && test -n "$HDR_KEYSTORE_PASSWORD"
          printf '%s' "$HDR_KEYSTORE_BASE64" | base64 --decode > "$HDR_KEYSTORE_PATH"
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64
      - name: Verify APK sizes and signatures
        run: |
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            bytes=$(stat -c%s "$apk")
            echo "$apk: $bytes bytes"
            test "$bytes" -lt 30000000
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/signature.txt"
            grep -qi "e16e64f7648af7b1b382814f0a64341cefd0f8ad169869b8da91d8afe53f81b3" "$RUNNER_TEMP/signature.txt"
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -E '^(package:|sdkVersion:|targetSdkVersion:|native-code:)'
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk HDR-Screen-Test-v1.0.0-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk HDR-Screen-Test-v1.0.0-armeabi-v7a.apk
          gh release create v1.0.0 HDR-Screen-Test-v1.0.0-arm64-v8a.apk HDR-Screen-Test-v1.0.0-armeabi-v7a.apk --title 'HDR Screen Test v1.0.0' --notes-file RELEASE_NOTES_v1.0.0.md

