name: Alpha APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze application
        run: flutter analyze lib
      - name: Build APK
        run: flutter build apk --debug
      - name: Publish alpha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk HDR-Screen-Test-v0.1.0-alpha.1.apk
          gh release create v0.1.0-alpha.1 HDR-Screen-Test-v0.1.0-alpha.1.apk --title 'HDR Screen Test v0.1.0-alpha.1' --notes-file RELEASE_NOTES_v0.1.0-alpha.1.md --prerelease

