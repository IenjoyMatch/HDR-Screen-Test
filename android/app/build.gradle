plugins {
    id 'com.android.application'
    id 'dev.flutter.flutter-gradle-plugin'
}
android {
    namespace 'com.example.hdrscreentest'
    compileSdk 36
    defaultConfig {
        applicationId 'com.example.hdrscreentest'
        minSdk 29
        targetSdk 36
        versionCode flutter.versionCode
        versionName flutter.versionName
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('HDR_KEYSTORE_PATH') ?: 'missing-release-keystore.jks')
            storePassword System.getenv('HDR_KEYSTORE_PASSWORD')
            keyAlias 'hdr-screen-test'
            keyPassword System.getenv('HDR_KEYSTORE_PASSWORD')
        }
    }
    buildTypes { release { signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
flutter { source '../..' }


